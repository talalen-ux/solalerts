<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>bubble</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <button id="back" class="ghost" hidden>‹</button>
    <h1 id="title">🫧 bubble</h1>
    <span id="who" class="muted"></span>
  </header>
  <nav id="tabs" hidden>
    <button data-tab="token">Token</button>
    <button data-tab="shop">Shop</button>
    <button data-tab="jams">Jams</button>
    <button data-tab="vote">Vote</button>
    <button data-tab="admin" id="admin-tab" hidden>Admin</button>
  </nav>
  <main id="view"></main>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
