# Solana token alert — single best filter (v2, backtest-informed)
#
# Goal: catch tokens at the moment a KOL-validated, volume-backed leg starts,
# with anti-rug/anti-bundler structure intact and headroom above current mcap.
#
# v2 changes (from DRBT backtest evidence, 1-week window):
#   - buy_volume_1m is USD. >5000 alone matched 11,805 tokens/week
#     (baseline: 29% did 2x+, 3.6% did 10x+), so it stays as the burst gate.
#   - NULL-safety everywhere: mc_1h, uri_count, image_hash_count,
#     launch_bundle_pct, fresh_holding_pct, rugcheck_score are NULL on
#     young tokens — bare comparisons silently excluded everything.
#   - top_source runs 6-40 in the wild; <= 2 was impossible. Relaxed to < 20.
#   - rugcheck_score: generic "LP unlocked" flag alone scores ~11,000, so
#     < 500 killed nearly all AMM tokens. < 12000 allows that single generic
#     flag but still rejects multi-flag tokens (e.g. 21,400).
#   - uri_count/image_hash_count = 1 replaced with <= 3 OR NULL: clone
#     relaunches show 4-11 duplicates; 2-3 can be innocent re-uploads.
#
# Flattened DRBT expression is kept in sync at the bottom of this file.

alert:
  name: alpha_ignition
  version: 2
  priority: P0
  thesis: >
    KOL has validated the token (>=1 buyer, >=1 holder) AND a $5k+ buy-volume
    burst hit in the last minute, with net buying, real maker breadth, deep
    enough LP, momentum (NULL-safe), proven traction, and no rug/bundler
    signals. Headroom enforced by mc < ath_mc * 1.1 to avoid blow-off tops.

  filters:
    # --- Safety floor (anti-rug / anti-bundler / anti-clone) ---
    - dev_sold IS NOT TRUE
    - mayhem IS NOT TRUE
    - blacklist_count = 0
    - "(rugcheck_score IS NULL OR rugcheck_score < 12000)"
    - "(uri_count IS NULL OR uri_count <= 3)"
    - "(image_hash_count IS NULL OR image_hash_count <= 3)"
    - "(launch_bundle_pct IS NULL OR launch_bundle_pct < 25)"
    - "(max_launch_bundle_pct IS NULL OR max_launch_bundle_pct < 35)"
    - "(fresh_holding_pct IS NULL OR fresh_holding_pct < 60)"
    - top_source < 20
    - name IS NOT NULL

    # --- Growth catalyst (KOL + volume burst + clean tape) ---
    - kol_buyers >= 1
    - kol_holders >= 1
    - buy_volume_1m > 5000
    - buy_volume > sell_volume
    - buyers > sellers
    - cnt_distinct_makers > 10
    - lp_sol > 10

    # --- Momentum + headroom (still going up, not topped out) ---
    - "(mc_1h IS NULL OR mc > mc_1h)"
    - mc > prev_slot_mc
    - ath_mc > 50000
    - mc < ath_mc * 1.1

  cooldown_minutes: 20

# Flattened single-expression form (DRBT filter syntax):
#
# dev_sold IS NOT TRUE AND mayhem IS NOT TRUE AND blacklist_count = 0
# AND (rugcheck_score IS NULL OR rugcheck_score < 12000)
# AND (uri_count IS NULL OR uri_count <= 3)
# AND (image_hash_count IS NULL OR image_hash_count <= 3)
# AND (launch_bundle_pct IS NULL OR launch_bundle_pct < 25)
# AND (max_launch_bundle_pct IS NULL OR max_launch_bundle_pct < 35)
# AND (fresh_holding_pct IS NULL OR fresh_holding_pct < 60)
# AND top_source < 20 AND name IS NOT NULL
# AND kol_buyers >= 1 AND kol_holders >= 1
# AND buy_volume_1m > 5000 AND buy_volume > sell_volume AND buyers > sellers
# AND cnt_distinct_makers > 10 AND lp_sol > 10
# AND (mc_1h IS NULL OR mc > mc_1h) AND mc > prev_slot_mc
# AND ath_mc > 50000 AND mc < ath_mc * 1.1
