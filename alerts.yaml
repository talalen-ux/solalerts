# Solana token alert — validated baseline + refinement candidates (v3)
#
# v3 replaces the theory-driven v2 with an EMPIRICALLY VALIDATED core: the
# condition below was backtested by the user in DRBT and produced, on 1,049
# matched tokens:
#
#   100X+:  0.48%   50X+: 0.95%   20X+: 2.38%   10X+: 6.10%
#   5X+:   14.59%    3X+: 27.07%   2X+: 41.47%
#   2X-:   45.00%   PostATH: 13.54%
#
# vs. the buy_volume_1m > 5000 solo baseline (29% 2x+, 3.6% 10x+) that is
# ~1.4-1.7x enrichment at every tier with a real 50x tail.
#
# Known weakness: 13.5% of alerts fire AFTER the token's ATH (PostATH).
# The refinement candidates below target that; each is a single added leg so
# backtest deltas are directly attributable.

alert:
  name: alpha_ignition
  version: 3
  priority: P0
  thesis: >
    A $1.5k+ one-minute buy burst on a token with real LP, buyer breadth,
    net buying, and a clean safety floor (rugcheck, no dev sell, no mayhem,
    low fresh-wallet concentration, low launch bundling, funded origin
    wallet) catches momentum legs early. Validated: 41.5% of signals did
    2x+, 6.1% did 10x+.

  # --- VALIDATED CORE (backtested 2026-08-18, n=1049) ---
  filters:
    - buy_volume_1m > 1500
    - mc > 15000
    - mc < 8000000
    - lp_sol > 6
    - buyers > 8
    - buys > sells
    - rugcheck_score < 2000
    - mayhem IS NOT TRUE
    - dev_sold IS NOT TRUE
    - fresh_holding_pct < 30
    - launch_bundle_pct < 25
    - origin_balance > 1

  cooldown_minutes: 20

# --- REFINEMENT CANDIDATES (add ONE at a time, backtest, compare) ---
#
# A. Headroom — kill the 13.5% PostATH entries (highest expected value):
#      AND mc < ath_mc * 1.1
#    Success = PostATH -> ~0%, 2x+ -> 45-48%, 10x tail preserved.
#
# B. KOL overlay — does KOL validation add edge on top of clean tape?
#      AND kol_buyers >= 1 AND kol_holders >= 1
#    Expect far fewer signals; only keep if per-tier rates rise materially.
#
# C. Slot momentum — avoid buying a red candle:
#      AND mc > prev_slot_mc
#
# Prior evidence (kept for reference):
#   - buy_volume_1m is USD; > 5000 solo: 11,805 matches/week, 29% 2x+.
#   - mc_1h / uri_count / rugcheck_score / fresh_holding_pct are NULL on
#     young tokens; bare comparisons on them silently drop rows (v1 bug).
#   - Generic "LP unlocked" rugcheck flag alone scores ~11,000, so
#     rugcheck_score < 2000 also implicitly rejects unlocked-LP AMM tokens.
#   - top_source runs 6-40 in the wild (v1's <= 2 matched nothing).

# Flattened DRBT expression (validated core, paste-ready):
#
# buy_volume_1m > 1500
# AND mc > 15000
# AND mc < 8000000
# AND lp_sol > 6
# AND buyers > 8
# AND buys > sells
# AND rugcheck_score < 2000
# AND mayhem IS NOT TRUE
# AND dev_sold IS NOT TRUE
# AND fresh_holding_pct < 30
# AND launch_bundle_pct < 25
# AND origin_balance > 1
