# Solana token alert — single best filter
#
# Goal: catch tokens at the moment a KOL-validated, volume-backed leg starts,
# with anti-rug/anti-bundler structure intact and headroom above current mcap.
#
# Layered as: safety_floor (must-pass) + growth signals (the catalyst).
# All parameter names match filter_parameters.xlsx. Implicit AND between items.

alert:
  name: alpha_ignition
  priority: P0
  thesis: >
    KOL has validated the token (>=1 buyer, >=1 holder) AND a $5k+ buy-volume
    burst hit in the last minute, with net buying, real maker breadth, deep
    enough LP, positive 1h momentum, proven traction (ath_mc > 50k), and no
    rug/bundler signals. Headroom enforced by mc < ath_mc * 1.1 to avoid
    blow-off tops.

  filters:
    # --- Safety floor (anti-rug / anti-bundler / anti-clone) ---
    - dev_sold IS NOT TRUE
    - mayhem IS NOT TRUE
    - blacklist_count = 0
    - rugcheck_score < 500
    - uri_count = 1
    - image_hash_count = 1
    - launch_bundle_pct < 25
    - max_launch_bundle_pct < 35
    - fresh_holding_pct < 60
    - top_source <= 2
    - name IS NOT NULL

    # --- Growth catalyst (KOL + volume burst + clean tape) ---
    - kol_buyers >= 1
    - kol_holders >= 1
    - buy_volume_1m > 5000
    - buy_volume > sell_volume
    - buyers > sellers
    - cnt_distinct_makers > 10
    - lp_sol > 10

    # --- Momentum + headroom (still going up, not topped out) ---
    - mc > mc_1h
    - ath_mc > 50000
    - mc < ath_mc * 1.1

  cooldown_minutes: 20
