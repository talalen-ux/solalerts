# Solana token alert — alpha_ignition v4 (offline-optimized on row-level export)
#
# Derived from backtest_query_1_2weeks_1.xlsx: 4,524 unique-mint signals over
# 2 weeks (2026-08-04..08-18) matching the v3 base condition, with outcomes.
#
# CRITICAL MEASUREMENT FINDING
# ----------------------------
# DRBT's `xs` outcome = current_ath_mc / entry_mc over the token's WHOLE LIFE,
# including price action BEFORE the signal. For every post_ath=True row the
# ATH predates entry, so its xs is inflated (enter at 0.5x of old ATH ->
# guaranteed "2x" without the price moving). ~13% of rows are affected, and
# they concentrate exactly where filters select for "established" tokens
# (dexscreener-paid + multi-KOL dip entries showed a fake 100% 2x rate).
# Consequence 1: headline DRBT backtest percentages are inflated; honest
#   forward numbers require entries at/near ATH, where xs is a true forward
#   multiple. All v4 numbers below use that universe (mc >= ath_mc * 0.95).
# Consequence 2: dip-buying strategies CANNOT be evaluated with DRBT xs at
#   all — their true forward return is simply not in the data.
#
# Honest forward results (breakout universe, n=3,270, ~234 signals/day):
#   base:                              2x+ 38.9%  10x+ 5.7%  20x+ 2.3%  EVc20 2.97
#   + med_makers>=1600 & kol>=1:       2x+ 45.4%  10x+ 8.0%  20x+ 4.2%  EVc20 3.55  (~44/day)
#   + cnt_from_cex>=10 & mm>=1600:     2x+ 44.2%  10x+ 9.4%  20x+ 4.5%  EVc20 3.60  (~24/day)
# Both are stable week-over-week. Rejected after honest measurement:
#   dexscreener/kol overlays (kill the 10x tail), slot momentum (no lift),
#   deep-dip entries (unmeasurable, see above).

alert:
  name: alpha_ignition
  version: 4
  priority: P0
  thesis: >
    Breakout entry: a $1.5k+/min buy burst on a token trading AT its
    all-time high (no overhead sellers), with deep maker history
    (med_makers >= 1600), at least one KOL buyer, real LP, buyer breadth,
    and a clean safety floor. Honest forward stats: 45% of signals did
    2x+, 8% did 10x+, 4% did 20x+ at ~44 signals/day.

  filters:
    # --- v3 validated base (unchanged) ---
    - buy_volume_1m > 1500
    - mc > 15000
    - mc < 8000000
    - lp_sol > 6
    - buyers > 8
    - buys > sells
    - rugcheck_score < 2000
    - mayhem IS NOT TRUE
    - dev_sold IS NOT TRUE
    - fresh_holding_pct < 30
    - launch_bundle_pct < 25
    - origin_balance > 1

    # --- v4 additions ---
    - mc >= ath_mc * 0.95     # breakout guard: at ATH, no bagholders above;
                              # also the only regime where DRBT xs is honest
    - med_makers >= 1600      # deep maker history: top-quartile lift +12.5pp
    - kol_buyers >= 1         # KOL validation (with mm: 45.4% 2x+, 4.2% 20x+)

  cooldown_minutes: 20

# Variant B (fewer, fatter signals ~24/day; best 10x/20x tail):
#   swap `kol_buyers >= 1` for `cnt_from_cex >= 10`
#   -> 2x+ 44.2%, 10x+ 9.4%, 20x+ 4.5%, EVc20 3.60
#
# Flattened DRBT expression (v4, paste-ready):
#
# buy_volume_1m > 1500
# AND mc > 15000
# AND mc < 8000000
# AND lp_sol > 6
# AND buyers > 8
# AND buys > sells
# AND rugcheck_score < 2000
# AND mayhem IS NOT TRUE
# AND dev_sold IS NOT TRUE
# AND fresh_holding_pct < 30
# AND launch_bundle_pct < 25
# AND origin_balance > 1
# AND mc >= ath_mc * 0.95
# AND med_makers >= 1600
# AND kol_buyers >= 1
