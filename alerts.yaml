# Solana token alerts — v5: two tiers after moonshot post-mortem
#
# Post-mortem of three 100x+ tokens the v4 filter missed (full per-slot
# histories: Plumber 1623x, MARIO64 849x, FTR 239x):
#
#   1. dev_sold IS NOT TRUE was the fatal leg on ALL THREE (pass rate 0-4%).
#      The dev dumped within the first minutes at 3-10k mc, the token became
#      community-run, THEN mooned. "Dev already fully exited early" removes
#      the dev-overhang risk; it is the community-takeover signature, not a
#      rug signal. With only that leg removed, the base filter catches
#      Plumber at 15.9k mc -> 346x forward and MARIO64 at 15.5k -> 164x.
#   2. origin_balance > 1 blocked FTR on 100% of rows (origin wallet held 0
#      SOL its entire life) — the funder emptied the wallet, token 239x'd.
#   3. med_makers >= 1600 would have cost Plumber even post-fix (its
#      lifetime max was 1442). Maker depth accretes late; as a hard leg it
#      structurally excludes early entries.
#   4. The breakout leg (mc >= ath_mc*0.95) delayed MARIO64's entry from
#      25k (100x fwd) to 140k (18x fwd).
#
#   Common profile of all three at the 15-17k mc entry window: fresh 0%,
#   bundle 0%, rugcheck 1, lp_sol 51-57 (very deep), buy_volume_1m 5.7-9.9k,
#   kol arriving within minutes. Plumber/FTR owners were serial deployers
#   (dev_deploys 1227/2846) — factory launches, another leg NOT to add.
#
# Tension with population stats: the 2-week export (4,524 rows) that
# validated tier A had dev_sold filtered OUT, so the dev-dumped universe is
# UNMEASURED — it plausibly contains many fast rugs. Tier B is therefore a
# CANDIDATE until a row-level export of its cohort is analyzed.

# ---------------------------------------------------------------------------
# TIER A — quality breakout (VALIDATED on 2-week honest forward data)
# 2x+ 45.4%, 10x+ 8.0%, 20x+ 4.2%, ~44 signals/day, stable week-over-week.
# ---------------------------------------------------------------------------
alert:
  name: alpha_ignition
  version: 5
  priority: P1
  thesis: >
    Breakout entry at ATH with deep maker history and KOL validation.
    Consistent singles-and-doubles machine; will NOT catch early
    community-takeover moonshots (see moonshot_cto).
  filters:
    - buy_volume_1m > 1500
    - mc > 15000
    - mc < 8000000
    - lp_sol > 6
    - buyers > 8
    - buys > sells
    - rugcheck_score < 2000
    - mayhem IS NOT TRUE
    - dev_sold IS NOT TRUE
    - fresh_holding_pct < 30
    - launch_bundle_pct < 25
    - origin_balance > 1
    - mc >= ath_mc * 0.95
    - med_makers >= 1600
    - kol_buyers >= 1
  cooldown_minutes: 20

# ---------------------------------------------------------------------------
# TIER B — fresh-migration moonshot (CANDIDATE — needs row-level backtest)
# v2 after 4th winner (DPG, 1897x): the play is now identified as a
# FRESH-MIGRATION SNIPE. All four winners' first tier-B-qualifying rows were
# minutes after LP migration (median 0.3-7.6 min post migration_slot),
# bonding_progress 85-88, and the near-identical 51-57 SOL LP.
# kol_buyers >= 1 was DROPPED: DPG had kol_buyers = 0 for its entire life
# and that one leg blocked every row of its 15k-100k window (it did 264x
# forward from the blocked entry). With kol dropped, tier B catches all
# four winners at 15.5-17.6k mc: 347x / 44x / 164x / 264x forward.
# ---------------------------------------------------------------------------
alert2:
  name: moonshot_cto
  version: 3
  priority: P0
  thesis: >
    Freshly migrated/launched token with a very clean launch (fresh/bundle
    <= 4%), deep LP (~50+ SOL), and a strong buy burst in the 15k-100k mc
    window. Dev has usually already dumped (community takeover) —
    deliberately not filtered on. Catches all 6 studied 100x+ tokens at
    15.5k-80k mc entries (44x-347x forward).
  filters:
    - buy_volume_1m > 2000        # v3: was 3000; 2303 at BULLSHIT's 18.9k
                                  # entry (123x fwd vs 74x when delayed)
    - mc > 15000
    - mc < 100000                 # early-entry zone; the whole point of tier B
    - lp_sol > 25                 # winners: 51-60; migration LP still intact
    - buyers > 8
    - buys > sells
    - "(rugcheck_score IS NULL OR rugcheck_score < 100)"
                                  # v3: NULL-safe. Rugcheck's scan lags fast
                                  # movers: Z500 (1575x) hit 100k mc in 45s
                                  # while rugcheck was still NULL, then showed
                                  # transient holder-concentration flags
                                  # (17202) before settling to 1 at 220k mc.
                                  # Strict <100 can never fire on fast pumps.
    - mayhem IS NOT TRUE
    - fresh_holding_pct < 10      # kept strict/non-NULL: chain-derived,
    - launch_bundle_pct < 10      # populated from row 0 on all 6 winners
    # deliberately ABSENT: dev_sold, origin_balance, med_makers, breakout,
    # kol_buyers (0% pass on DPG), migration_slot IS NOT NULL (the field is
    # still NULL at the best entry rows — it backfills a few slots later)
    # Optional tightener if the denominator is too noisy: bonding_progress > 80
  cooldown_minutes: 20

# Validation plan for tier B (no quota needed beyond one backtest):
#   1. Run the tier B expression as a DRBT backtest over 2 weeks.
#   2. Export ROW-LEVEL results (like backtest_query_1_2weeks_1.xlsx).
#   3. Analyze honest forward stats offline (breakout-safe subset or
#      per-token histories); tune lp_sol / rugcheck / mc ceiling from data.
#
# Flattened tier A:
# buy_volume_1m > 1500 AND mc > 15000 AND mc < 8000000 AND lp_sol > 6
# AND buyers > 8 AND buys > sells AND rugcheck_score < 2000
# AND mayhem IS NOT TRUE AND dev_sold IS NOT TRUE AND fresh_holding_pct < 30
# AND launch_bundle_pct < 25 AND origin_balance > 1
# AND mc >= ath_mc * 0.95 AND med_makers >= 1600 AND kol_buyers >= 1
#
# Flattened tier B (v3):
# buy_volume_1m > 2000 AND mc > 15000 AND mc < 100000 AND lp_sol > 25
# AND buyers > 8 AND buys > sells
# AND (rugcheck_score IS NULL OR rugcheck_score < 100)
# AND mayhem IS NOT TRUE AND fresh_holding_pct < 10
# AND launch_bundle_pct < 10
#
# Winner scoreboard (per-slot replays; entry = first qualifying row):
#   Plumber  1623x peak  entry 15.9k -> 347x fwd
#   FTR       239x peak  entry 17.6k ->  44x fwd
#   MARIO64   849x peak  entry 15.5k -> 164x fwd
#   BULLSHIT 1035x peak  entry 18.9k -> 123x fwd
#   DPG      1897x peak  entry 17.0k -> 264x fwd
